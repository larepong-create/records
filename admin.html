<style>
/* Layout: back office in plum — left rail on desktop, bottom tabs on phones. Queue on the left, the open request on the right;
   status is always a coloured pill, overdue is the one red signal. The A4 view is real paper: white in both themes, prints clean. */
:root {
  --bg: #f7f2f5; --surface: #ffffff; --sunk: #fbf7f9; --ink: #2b1624; --muted: #76606d; --line: #eadce4;
  --accent: #b0246a; --accent-deep: #8a1a52; --accent-soft: #fbe4ef; --accent-line: #ecb3cf; --accent-ink: #ffffff;
  --cross: #d9700f; --cross-soft: #fff0df;
  --good: #1f8a55; --good-soft: #dcf2e5; --warn: #a86400; --warn-soft: #fff1d6; --bad: #c4302b; --bad-soft: #fde3e1; --info: #2a6fb5; --info-soft: #e1edfa;
  --shadow: 0 1px 2px rgba(70, 20, 45, .05), 0 6px 22px rgba(70, 20, 45, .07);
  --paper: #ffffff; --paper-ink: #1b1b1b; --paper-line: #9a9a9a; --paper-fill: #0d3b8f;
  --f-display: "Bai Jamjuree", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Thai", "Sarabun", "Leelawadee UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171015; --surface: #22161e; --sunk: #1c1219; --ink: #f5e9f0; --muted: #bba2b1; --line: #3a2633;
  --accent: #ec6aa8; --accent-deep: #f6a6cb; --accent-soft: #46182f; --accent-line: #77304f; --accent-ink: #2a0717;
  --cross: #ffa54d; --cross-soft: #3f2a12;
  --good: #63c98c; --good-soft: #173323; --warn: #f2b453; --warn-soft: #3b2c10; --bad: #f08378; --bad-soft: #42201d; --info: #7fb2ec; --info-soft: #172b42;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #171015; --surface: #22161e; --sunk: #1c1219; --ink: #f5e9f0; --muted: #bba2b1; --line: #3a2633;
  --accent: #ec6aa8; --accent-deep: #f6a6cb; --accent-soft: #46182f; --accent-line: #77304f; --accent-ink: #2a0717;
  --cross: #ffa54d; --cross-soft: #3f2a12;
  --good: #63c98c; --good-soft: #173323; --warn: #f2b453; --warn-soft: #3b2c10; --bad: #f08378; --bad-soft: #42201d; --info: #7fb2ec; --info-soft: #172b42;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.3; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.1rem; font-weight: 600; } h3 { font-size: .98rem; font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.muted { color: var(--muted); } .small { font-size: .84rem; } .num { font-variant-numeric: tabular-nums; } .mono { font-family: var(--f-mono); font-size: .86em; }

/* shell */
.shell { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 11px; padding: 0 6px; }
.mk { width: 40px; height: 40px; flex: none; filter: drop-shadow(0 2px 5px rgba(140,20,80,.25)); }
.brand-t { font-family: var(--f-display); font-weight: 700; font-size: 1rem; line-height: 1.2; color: var(--accent-deep); }
.brand-s { font-size: .76rem; color: var(--muted); line-height: 1.3; }
.nav { display: grid; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 1px solid transparent; background: none; border-radius: 12px; cursor: pointer; text-align: left; color: var(--muted); font-weight: 500; position: relative; }
.nav button svg { width: 19px; height: 19px; flex: none; }
.nav button:hover { background: var(--sunk); color: var(--ink); }
.nav button.on { background: var(--accent-soft); color: var(--accent-deep); border-color: var(--accent-line); font-weight: 600; }
.nav .badge { margin-left: auto; background: var(--bad); color: #fff; font-size: .7rem; padding: 0 7px; border-radius: 999px; line-height: 1.7; font-variant-numeric: tabular-nums; }
.me { margin-top: auto; border-top: 1px solid var(--line); padding: 12px 6px 0; display: grid; gap: 8px; font-size: .85rem; }
.main { min-width: 0; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 16px; }
.wrap.narrow { max-width: 520px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.mob-top { display: none; }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; inset: auto 0 0 0; height: auto; flex-direction: row; padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px)); border-right: 0; border-top: 1px solid var(--line); z-index: 20; }
  .rail .brand, .rail .me { display: none; }
  .nav { grid-auto-flow: column; grid-auto-columns: 1fr; width: 100%; }
  .nav button { flex-direction: column; gap: 1px; font-size: .7rem; padding: 6px 2px; justify-content: center; text-align: center; }
  .nav .badge { position: absolute; top: 0; left: calc(50% + 6px); margin: 0; }
  .main { padding-block: 0 100px; }
  .mob-top { display: flex; align-items: center; gap: 10px; padding-block: 10px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
  .mob-top .mk { width: 34px; height: 34px; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
}
.nav button.mob-only { display: none; }
@media (max-width: 860px) { .nav button.mob-only { display: flex; } }

/* elements */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; box-shadow: var(--shadow); }
.ptitle { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--accent-line); color: var(--accent-deep); background: var(--surface); padding: 9px 16px; border-radius: 12px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.btn svg { width: 17px; height: 17px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.dng { color: var(--bad); border-color: var(--bad-soft); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.sm { padding: 4px 10px; font-size: .84rem; border-radius: 10px; }
.btn.big { padding: 12px 22px; font-size: 1rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
label.f { display: grid; gap: 5px; font-size: .86rem; font-weight: 500; min-width: 0; }
.hint { font-size: .8rem; color: var(--muted); font-weight: 400; }
.i { width: 100%; border: 1px solid var(--line); background: var(--sunk); border-radius: 12px; padding: 9px 11px; font-size: .95rem; min-width: 0; }
textarea.i { resize: vertical; min-height: 70px; line-height: 1.6; }
.i:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
@media (max-width: 640px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.stack { display: grid; gap: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.err { color: var(--bad); font-size: .88rem; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; cursor: pointer; }
.check input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; padding: 3px; background: var(--surface); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 9px; cursor: pointer; font-size: .86rem; color: var(--muted); font-weight: 500; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 10px; font-size: .76rem; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-new { background: var(--accent-soft); color: var(--accent-deep); }
.s-verify { background: var(--info-soft); color: var(--info); }
.s-prep { background: var(--warn-soft); color: var(--warn); }
.s-ready { background: var(--cross-soft); color: var(--cross); }
.s-done { background: var(--good-soft); color: var(--good); }
.s-cancel { background: var(--sunk); color: var(--muted); }
.late { color: var(--bad); font-weight: 600; }
.tag { border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; font-size: .74rem; color: var(--muted); white-space: nowrap; }
.empty { padding: 28px 12px; text-align: center; color: var(--muted); font-size: .9rem; }

/* queue */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 1000px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 520px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; text-align: left; cursor: pointer; display: grid; gap: 2px; box-shadow: var(--shadow); }
.kpi .l { font-size: .8rem; color: var(--muted); }
.kpi .v { font-family: var(--f-display); font-size: 1.75rem; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpi.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.kpi.alert .v { color: var(--bad); }
.brs { padding: 0; }
.brs-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 12px 16px 4px; }
.brs-t { overflow-x: auto; padding: 0 8px 8px; }
.brs table { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; min-width: 560px; }
.brs th, .brs td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.brs thead th { font-weight: 500; color: var(--muted); font-size: .8rem; }
.brs th:first-child { text-align: left; font-weight: 600; }
.brs tbody tr { cursor: pointer; } .brs tbody tr:hover { background: var(--sunk); } .brs tbody tr.on { background: var(--accent-soft); }
.brs tbody tr:last-child th, .brs tbody tr:last-child td { border-bottom: 0; }
.split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }
@media (max-width: 1000px) { .split { grid-template-columns: minmax(0, 1fr); } }
.qpanel { padding: 0; overflow: hidden; }
.qhead { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.qhead .i { flex: 1 1 160px; width: auto; }
.qhead select.i { flex: 0 1 150px; }
.queue { display: grid; max-height: 760px; overflow: auto; }
.qi { display: grid; gap: 3px; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; width: 100%; }
.qi:hover { background: var(--sunk); }
.qi.sel { background: var(--accent-soft); }
.qi .r1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.qi .r1 .g { flex: 1; }
.qi .r2 { font-weight: 600; }
.qi .r3 { font-size: .84rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.det { display: grid; gap: 16px; }
.dtop { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
.dtop h2 { font-size: 1.25rem; margin-top: 4px; }
.stepper { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.stepper div { font-size: .74rem; text-align: center; color: var(--muted); line-height: 1.3; }
.stepper div i { display: block; height: 6px; border-radius: 6px; background: var(--line); margin-bottom: 6px; }
.stepper div.ok i { background: var(--good); } .stepper div.cur i { background: var(--accent); } .stepper div.cur { color: var(--accent-deep); font-weight: 600; }
.kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 6px 12px; font-size: .92rem; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 520px) { .kv { grid-template-columns: minmax(0, 1fr); gap: 0; } .kv dd { margin-bottom: 8px; } }
.box { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.box h3 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.ck { display: flex; gap: 10px; align-items: flex-start; font-size: .92rem; cursor: pointer; }
.ck input { width: 18px; height: 18px; accent-color: var(--good); margin-top: 2px; flex: none; }
.ck.done span { color: var(--muted); text-decoration: line-through; }
.log { display: grid; gap: 8px; font-size: .88rem; }
.log div { display: grid; grid-template-columns: 138px minmax(0, 1fr); gap: 10px; }
@media (max-width: 520px) { .log div { grid-template-columns: minmax(0, 1fr); gap: 0; } }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; }
.sigimg { height: 60px; width: 220px; max-width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; display: flex; align-items: center; color: #8a7380; font-size: .8rem; }
.sigimg img { max-height: 100%; max-width: 100%; }

/* misc */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 12px; z-index: 100; font-size: .9rem; max-width: calc(100% - 32px); }
.toast.bad { background: var(--bad); color: #fff; }
@media (max-width: 860px) { .toast { bottom: calc(86px + env(safe-area-inset-bottom, 0px)); } }
.modal { position: fixed; inset: 0; background: rgba(40, 5, 20, .45); z-index: 80; display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.modal .mbox { background: var(--surface); border-radius: var(--r); padding: 22px; width: min(480px, 100%); display: grid; gap: 14px; box-shadow: var(--shadow); }
.banner { background: var(--warn-soft); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: .86rem; }
.banner b { color: var(--warn); }
.login { min-height: 70vh; display: grid; place-items: center; }
.login .panel { width: min(420px, 100%); display: grid; gap: 16px; }
.tbl { width: 100%; border-collapse: collapse; font-size: .88rem; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { color: var(--muted); font-weight: 500; font-size: .8rem; }
.scroll { overflow-x: auto; }
.qrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 12px; }
.qrc { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; justify-items: center; text-align: center; background: var(--sunk); }
.qrc .qr { background: #fff; padding: 10px; border-radius: 10px; width: 170px; height: 170px; display: grid; place-items: center; }
.qrc .qr img, .qrc .qr canvas { width: 150px !important; height: 150px !important; }
.qrc code { font-family: var(--f-mono); font-size: .74rem; overflow-wrap: anywhere; color: var(--accent-deep); }
.sk i { display: block; height: 14px; border-radius: 6px; background: var(--sunk); margin: 10px 0; }

/* A4 */
.a4bar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.paper-wrap { overflow-x: auto; padding-bottom: 8px; }
.paper { width: 794px; min-height: 1123px; margin: 0 auto; background: var(--paper); color: var(--paper-ink); padding: 44px 56px; box-shadow: var(--shadow); font: 13.5px/1.75 var(--f-body); }
.paper .ph { display: flex; align-items: center; gap: 14px; border-bottom: 2px solid var(--paper-ink); padding-bottom: 10px; margin-bottom: 14px; }
.paper .ph .mk { width: 56px; height: 56px; filter: none; }
.paper .ph h1 { font-size: 19px; flex: 1; }
.paper .ph .no { text-align: right; font-size: 12px; line-height: 1.5; }
.paper .ln { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin: 3px 0; }
.paper .f { display: inline-flex; gap: 6px; align-items: baseline; }
.paper .f b { white-space: nowrap; }
.paper .v { border-bottom: 1px dotted var(--paper-line); min-width: 90px; padding: 0 6px; color: var(--paper-fill); font-weight: 500; }
.paper .v.w { flex: 1; min-width: 160px; }
.paper .grp { margin-top: 10px; font-weight: 700; }
.paper .cb { display: flex; gap: 8px; align-items: baseline; padding-left: 52px; margin: 2px 0; }
.paper .cb > span { flex: 1; display: flex; flex-wrap: wrap; gap: 4px; align-items: baseline; }
.paper i.bx { font-style: normal; width: 14px; height: 14px; border: 1.3px solid var(--paper-ink); display: inline-grid; place-items: center; font-size: 12px; line-height: 1; flex: none; transform: translateY(2px); color: var(--paper-fill); font-weight: 700; }
.paper .sigs { display: grid; grid-template-columns: 1fr 1fr; border: 1.3px solid var(--paper-ink); margin-top: 16px; }
.paper .sigs > div { padding: 8px 14px 12px; min-height: 120px; }
.paper .sigs > div + div { border-left: 1.3px solid var(--paper-ink); }
.paper .sigs h4 { margin: 0 0 6px; text-align: center; font-size: 13.5px; }
.paper .sgn { height: 48px; display: flex; align-items: flex-end; }
.paper .sgn img { max-height: 48px; }
.paper .rcpt { border-top: 1.3px dotted var(--paper-ink); margin-top: 22px; padding-top: 10px; }
.paper .rcpt .two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 8px; }
.paper .foot { margin-top: 20px; font-size: 11px; color: #555; display: flex; justify-content: space-between; }
@media print {
  @page { size: A4; margin: 0; }
  body { background: #fff; }
  .rail, .mob-top, .a4bar, .toast, body::before { display: none !important; }
  .shell { display: block; } .main { padding: 0 !important; } .wrap { display: block; max-width: none; }
  .paper-wrap { overflow: visible; padding: 0; }
  .paper { box-shadow: none; margin: 0; width: 210mm; min-height: 0; padding: 10mm 14mm; font-size: 12.6px; line-height: 1.68; break-inside: avoid; }
  .paper .foot { margin-top: 12px; } .paper .sigs > div { min-height: 104px; }
}
</style>

  function bindDetail(box, r) {

    function drawQr() { (s.branches || []).forEach(function (b, i) { var bx = qs('#qr' + i, el); if (!bx) return; bx.innerHTML = ''; try { new window.QRCode(bx, { text: base + '?b=' + b.code, width: 300, height: 300, colorDark: '#4a0f2e', colorLight: '#ffffff', correctLevel: window.QRCode.CorrectLevel.M }); } catch (e) { bx.textContent = 'สร้าง QR ไม่ได้'; } }); }
    if (window.QRCode) drawQr(); else { var sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; sc.onload = drawQr; sc.onerror = function () { qsa('.qr', el).forEach(function (q) { q.textContent = 'โหลดตัวสร้าง QR ไม่ได้'; }); }; document.head.appendChild(sc); }
    qsa('[data-cp]', el).forEach(function (b) { b.onclick = function () { var t = b.dataset.cp; try { navigator.clipboard.writeText(t).then(function () { toast('คัดลอกแล้ว'); }, function () { toast('คัดลอกไม่ได้ กดค้างที่ลิงก์เพื่อคัดลอก', true); }); } catch (e) { toast('คัดลอกไม่ได้ กดค้างที่ลิงก์เพื่อคัดลอก', true); } }; });
    function lines(id) { return qs(id, el).value.split('\n').map(function (x) { return x.trim(); }).filter(String); }
    qs('#sSave', el).onclick = function () {
      var p = { orgName: qs('#sOrg', el).value.trim(), appUrl: qs('#sUrl', el).value.trim(), branches: lines('#sBr').map(function (l) { var k = l.split('='); return { code: k[0].trim().toUpperCase(), name: (k[1] || k[0]).trim() }; }),
        lineId: qs('#sLid', el).value.trim(), slaDays: Math.max(1, Math.min(30, +qs('#sSla', el).value || 3)), notifyNew: qs('#sNew', el).checked, lineTo: qs('#sTo', el).value.trim() };
      var tok = qs('#sTok', el).value.trim(); if (tok) p.lineToken = tok;
      busy(qs('#sSave', el), authed('saveSettings', p)).then(function () { toast('บันทึกการตั้งค่าแล้ว'); return call('bootstrap', state.token); }).then(function (b) { state.config = b.config; renderShell(); go('settings'); });
    };
    qs('#sTest', el).onclick = function () { busy(qs('#sTest', el), authed('testNotify')).then(function () { toast('ส่งข้อความทดสอบแล้ว'); }); };
    if (qs('#sReset', el)) qs('#sReset', el).onclick = function () { Demo._reset(); state.full = {}; toast('รีเซ็ตข้อมูลตัวอย่างแล้ว'); load(); };
    qs('#uAdd', el).onclick = function () { editUser(null); };
    qsa('[data-u]', el).forEach(function (b) { b.onclick = function () { editUser(users[+b.dataset.u]); }; });
    function editUser(u) {
      var n = !u; u = u || { username: '', name: '', role: 'branch', branch: (state.config.branches[0] || {}).code, active: true };
      var m = modal('<h2>' + (n ? 'เพิ่มผู้ใช้' : 'แก้ไขผู้ใช้ ' + esc(u.username)) + '</h2><form class="stack" id="uF"><label class="f"><span>ชื่อผู้ใช้</span><input class="i mono" id="uU" value="' + esc(u.username) + '"' + (n ? '' : ' readonly') + ' autocapitalize="off"></label><label class="f"><span>ชื่อที่แสดง</span><input class="i" id="uN" value="' + esc(u.name) + '"></label>' +
        '<div class="grid2"><label class="f"><span>บทบาท</span><select class="i" id="uR">' + Object.keys(ROLES).map(function (k) { return '<option value="' + k + '"' + (u.role === k ? ' selected' : '') + '>' + ROLES[k] + '</option>'; }).join('') + '</select></label><label class="f"><span>สาขา (เจ้าหน้าที่สาขา)</span><select class="i" id="uB"><option value="">-</option>' + state.config.branches.map(function (b) { return '<option value="' + esc(b.code) + '"' + (u.branch === b.code ? ' selected' : '') + '>' + esc(b.name) + '</option>'; }).join('') + '</select></label></div>' +
        '<label class="f"><span>' + (n ? 'รหัสผ่าน' : 'รหัสผ่านใหม่ (เว้นว่าง = ไม่เปลี่ยน)') + '</span><input class="i" id="uP" type="password" autocomplete="new-password"></label><label class="check"><input type="checkbox" id="uA"' + (u.active ? ' checked' : '') + '><span>เปิดใช้งาน</span></label>' +
        '<div class="row"><button class="btn pri" type="submit">บันทึก</button><button class="btn ghost" type="button" data-close>ยกเลิก</button></div></form>');
      qs('#uF', m).onsubmit = function (e) { e.preventDefault(); busy(qs('[type=submit]', m), authed('saveUser', { username: qs('#uU', m).value, name: qs('#uN', m).value, role: qs('#uR', m).value, branch: qs('#uB', m).value, password: qs('#uP', m).value, active: qs('#uA', m).checked })).then(function () { m.remove(); toast('บันทึกผู้ใช้แล้ว'); viewSettings(el); }); };
    }
  }

  // ---------- auto refresh + boot ----------
  setInterval(function () {
    if (!state.user || document.visibilityState !== 'visible' || document.querySelector('.modal') || state.view !== 'queue') return;
    var a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    load().catch(function () { });
  }, 90000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && state.user && state.view === 'queue') load().catch(function () { }); });
  window.addEventListener('unhandledrejection', function (e) { e.preventDefault(); });
  var saved = store('mr_token');
  if (saved) { state.token = saved; start(); } else viewLogin('');
})();
</script>

</html>
